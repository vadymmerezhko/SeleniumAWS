# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches:
      - "main"
      - "dev"
      - "feature**"
      - "fix**"
  pull_request:
    branches:
      - "main"
      - "dev"
      - "feature**"
      - "fix**"
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  container-test-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Java code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Unit Tests
        run: mvn test "-DtestSuite=./src/test/resources/testngUnitTests.xml"

      # TODO: Fix web element tests
      #- name: Web Element Unit Tests
      #  run: mvn test "-DtestSuite=./src/test/resources/testngWebElementSUnitTests.xml"

      # TODO: Uncomment when Maven exec plugin vulnerability is fixed.
      #- name: Test - AWS Local Docker - Chrome latest
      #  run: mvn -f aws-local-pom.xml clean compile exec:java "-DthreadCount=4" "-DtestMode=local_docker" "-Dbrowser=chrome:latest" "-DtestngFile=testngMethod.xml"

      # TODO: Uncomment when Login test is fixed in GitHub Actions CI.
      # - name: Login Test - Local Docker - Linux Chrome latest
      #  run: mvn clean test "-DtestSuite=./src/test/resources/testngStandardUserLogin.xml" "-Dheadless=true"

      - name: Web Form Test - Local Docker - Linux Chrome latest
        run: mvn clean test "-DtestSuite=./src/test/resources/testngMethod.xml" "-Dheadless=true"

      - name: Web Form Test (failed to record video and get screenshot)
        run: mvn clean test "-DtestSuite=./src/test/resources/testngMethod.xml" " "-Dheadless=true" "-Dhighlight=true" "-DdebugFail=true" "-DscreenshotOnFail=true" "-DvideoOnFail=true"
        continue-on-error: true

      # TODO: Fix local Docker auto Safari latest.
      #- name: Test - Local Docker Auto - Linux Safari latest
      #  run: mvn clean test "-DtestSuite=./src/test/resources/testngMethod.xml" "-DthreadCount=2" "-DtestMode=local_docker_auto" "-Dbrowser=safari:latest"

      # TODO: Fix local Docker auto Edge latest.
      #- name: Test - Local Docker Auto - Linux Edge latest
      #  run: mvn clean test "-DtestSuite=./src/test/resources/testngMethod.xml" "-DthreadCount=2" "-DtestMode=local_docker_auto" "-Dbrowser=edge:latest"

      # TODO: Fix local Docker auto Chrome latest.
      #- name: Test - Local Auto - Linux Chrome
      #  run: mvn clean test "-DtestSuite=./src/test/resources/testngMethod.xml" "-DthreadCount=2" "-DtestMode=local_auto" "-Dbrowser=chrome:stable"

      - name: Test - Local Playwright - Linux Firefox
        run: mvn clean test "-DtestSuite=./src/test/resources/testngMethod.xml" "-DtestMode=local_playwright" "-Dbrowser=firefox"

      # TODO: Fix AWS Device Farm Windows Edge.
      #- name: Test - AWS Device Farm - Windows Edge
      #  run: mvn clean test "-DtestSuite=./src/test/resources/testngMethod.xml" "-DthreadCount=5" "-DtestMode=aws_device_farm" "-Dbrowser=edge:latest"

      # TODO: Fix AWS Docker Chrome.
      #- name: Test - AWS Remote Docker - Linux Chrome
      #  run: mvn clean test "-DtestSuite=./src/test/resources/testngMethod.xml" "-DthreadCount=8" "-DtestMode=aws_docker" "-Dbrowser=chrome:latest"

      - name: Test - Local Playwright Accessibility Test - Chromium
        run: mvn clean test "-DtestSuite=./src/test/resources/testngMethod.xml" "-DthreadCount=2" "-DtestMode=local_accessibility"

      # ✅ Upload raw reports as downloadable artifact
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports

      # ✅ Publish into GitHub Checks tab
      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
