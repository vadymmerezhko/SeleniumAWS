# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches:
      - "main"
      - "dev"
      - "feature**"
      - "fix**"
  pull_request:
    branches:
      - "main"
      - "dev"
      - "feature**"
      - "fix**"
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  container-test-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Java code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Unit Tests
        run: mvn test \
            "-DtestSuite=./src/test/resources/testngUnitTests.xml" \
            "-Dsurefire.reportsDirectory=target/target/surefire-reports-unit-tests/"

      # TODO: Uncomment when web element tests are fixed
      #- name: Web Element Unit Tests
      #  run: mvn test \
      #     "-DtestSuite=./src/test/resources/testngWebElementSUnitTests.xml" \
      #     "-Dsurefire.reportsDirectory=target/surefire-reports-unit_tests"

      # TODO: Uncomment when Maven exec plugin vulnerability is fixed.
      #- name: Test - AWS Local Docker - Chrome latest
      #  run: mvn -f aws-local-pom.xml clean compile exec:java \
      #   "-DthreadCount=4" "-DtestMode=local_docker" \
      #   "-Dbrowser=chrome:latest" \
      #   "-DtestngFile=testngMethod.xml"

      - name: Web Form Test - Local Docker - Linux Chrome latest
        run: mvn clean test \
            "-DtestSuite=./src/test/resources/testngMethod.xml" \
            "-Dheadless=true" \
            "-Dsurefire.reportsDirectory=target/surefire-reports-local-docker/"

      - name: Web Form Test (failed to record video and get screenshot)
        run: mvn clean test \
            "-DtestSuite=./src/test/resources/testngMethod.xml" \
            "-Dheadless=true" \
            "-Dhighlight=true" \
            "-DdebugFail=true" \
            "-DscreenshotOnFail=true" \
            "-DvideoOnFail=true" \
            "-Dsurefire.reportsDirectory=target/surefire-reports-failed/"
        continue-on-error: true

      - name: Web Form Test - Local Docker Auto - Linux Firefox latest
        run: mvn clean test \
            "-DtestSuite=./src/test/resources/testngMethod.xml" \
            "-DtestMode=local_docker_auto" \
            "-Dbrowser:firefox:latest" \
            "-Dheadless=true" \
            "-Dsurefire.reportsDirectory=target/surefire-reports-local-docker-auto/"

      - name: Test - Local Playwright - Linux Firefox
        run: mvn clean test \
            "-DtestSuite=./src/test/resources/testngMethod.xml" \
            "-DtestMode=local_playwright" \
            "-Dbrowser=firefox" \
            "-Dsurefire.reportsDirectory=target/surefire-reports-local-playwright/"

      # TODO: Fix AWS Device Farm Windows Edge.
      #- name: Test - AWS Device Farm - Windows Edge
      #  run: mvn clean test \
      #   "-DtestSuite=./src/test/resources/testngMethod.xml" \
      #   "-DthreadCount=5" \
      #   "-DtestMode=aws_device_farm" "-Dbrowser=edge:latest"

      # TODO: Fix AWS Docker Chrome.
      #- name: Test - AWS Remote Docker - Linux Chrome
      #  run: mvn clean test \
      #   "-DtestSuite=./src/test/resources/testngMethod.xml" \
      #   "-DthreadCount=8" \
      #   "-DtestMode=aws_docker" \
      #   "-Dbrowser=chrome:latest"

      - name: Test - Local Playwright Accessibility Test - Chromium
        run: mvn clean test \
            "-DtestSuite=./src/test/resources/testngMethod.xml" \
            "-DthreadCount=2" "-DtestMode=local_accessibility" \
            "-Dsurefire.reportsDirectory=target/surefire-reports-accessibility/"

      # Upload reports as separate artifacts
      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-unit
          path: target/surefire-reports-unit-tests/

      - name: Upload Local Docker Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-local-docker
          path: target/surefire-reports-local-docker/

      - name: Upload Failed Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-failed
          path: target/surefire-reports-failed/

      - name: Upload Local Docker Auto Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-local-docker-auto
          path: target/surefire-reports-local-docker-auto/

      - name: Upload Local Playwright Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-playwright
          path: target/surefire-reports-playwright/

      - name: Upload Accessibility Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-accessibility
          path: target/surefire-reports-accessibility/
