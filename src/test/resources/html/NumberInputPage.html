<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decimal Number Input</title>
</head>
<body>
<form>
  <label for="quantity">Quantity:</label>
  <input type="number" id="quantity" name="quantity" min="0.5" max="99.5" step="0.5" placeholder="Enter a decimal number" required>
  <button type="submit">Submit</button>
</form>
</body>
</html>
