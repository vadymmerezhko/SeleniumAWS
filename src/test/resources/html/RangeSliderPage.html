<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range Input Test</title>
</head>
<body>
<h2>Range Input Examples</h2>

<!-- Range input with min, max, and step set -->
<label>Range 2 (min=-1000.0, max=1000.0, step="any"):</label>
<input type="range" id="range2" min="-1000.0" max="1000.0" step="any">
<br><br>

<!-- Range input without min, max, and no step -->
<label for="range2">Range 3 (default settings):</label>
<input type="range" id="range3">
<br><br>

<!-- Range input with min, max, and step below 0.05 -->
<label for="range3">Range 4 (min=0.1, max=0.9):</label>
<input type="range" id="range4" min="0.1" max="0.9" step="0.05" value="0.1">

</body>
</html>
